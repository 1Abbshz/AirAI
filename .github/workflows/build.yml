name: Build AirAI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,ST=Debug,C=US"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Re-sign APK with v1+v2+v3
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          APK_IN=$(ls app/build/outputs/apk/debug/*.apk)
          APK_ALIGNED=/tmp/app-aligned.apk
          APK_SIGNED=/tmp/app-signed.apk

          # Generate a keystore for signing
          keytool -genkeypair -v \
            -keystore /tmp/signing.keystore \
            -alias airai \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AirAI,OU=AirAI,O=AirAI,L=Debug,ST=Debug,C=US"

          # Zipalign
          $BUILD_TOOLS/zipalign -f 4 "$APK_IN" "$APK_ALIGNED"

          # Copy aligned APK (apksigner signs in-place)
          cp "$APK_ALIGNED" "$APK_SIGNED"

          # Sign with v1+v2+v3
          $BUILD_TOOLS/apksigner sign \
            --ks /tmp/signing.keystore \
            --ks-key-alias airai \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK_SIGNED"

          # Replace original APK
          cp "$APK_SIGNED" "$APK_IN"

          # Verify
          $BUILD_TOOLS/apksigner verify --verbose "$APK_IN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airai-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
